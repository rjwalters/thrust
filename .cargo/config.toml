# Use the fast lld linker. We pass it via `-fuse-ld=lld` rather than also
# pinning `linker = "clang"`: the default gcc/cc driver (present on every Linux
# box) honors `-fuse-ld=lld` too, so requiring clang added a dependency without
# benefit — fresh machines failed with an opaque "linker `clang` not found".
# Only `lld` itself is needed now (sudo apt install -y lld).
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# getrandom 0.3 (pulled by rand 0.9) has no default backend on
# wasm32-unknown-unknown. This cfg selects the JS backend and pairs with the
# `wasm_js` feature enabled in Cargo.toml's wasm32 target table — both are
# required for the WASM build (web demo / GitHub Pages) to compile.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

[build]
# Use all available CPU cores for parallel compilation
jobs = 8

[alias]
# Convenient aliases for common commands
check-all = "check --all-targets --all-features"
test-all = "test --all-targets --all-features"
clippy-all = "clippy --all-targets --all-features -- -D warnings"
