name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Check formatting
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        # NB: do not use --all -- that descends into path-dep submodules
        # (envs/bucket-brigade/) which have their own upstream rustfmt config
        # and cannot be reformatted from this repo.
        run: cargo fmt -- --check

  # Lint with clippy, denying all warnings, across the full training build
  # (lib, tests, examples) and the env-bucket-brigade feature combo. Keeps
  # clippy debt from accumulating silently on either feature set.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - name: cargo clippy --all-targets --features training -- -D warnings
        run: cargo clippy --all-targets --features training -- -D warnings
      # Also lint the optional env-bucket-brigade feature, which pulls in the
      # bucket-brigade-core submodule (initialised by submodules: recursive
      # above). Keeps this feature combo's clippy debt from accumulating
      # silently the way the base gate does for `training`.
      - name: cargo clippy --all-targets --features "training,env-bucket-brigade" -- -D warnings
        run: cargo clippy --all-targets --features "training,env-bucket-brigade" -- -D warnings
      # Also lint the optional env-atari feature. Option D (subprocess via
      # ale-py) adds no native dep, so this compiles safely on a bare runner
      # with no ALE present; the live-emulator tests are runtime-skipped when
      # ale-py is absent. See docs/ALE_BINDING_STRATEGY.md.
      - name: cargo clippy --all-targets --features "training,env-atari" -- -D warnings
        run: cargo clippy --all-targets --features "training,env-atari" -- -D warnings

  # Cheap "does it parse" check without the training stack.
  # `--no-default-features` drops the `training` feature (and thus `burn`).
  check_no_training:
    name: Check (no training)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - name: cargo check --no-default-features
        run: cargo check --no-default-features

  # Real test job with the default Burn `NdArray` backend on Linux. Pure
  # Rust — no external system libraries required.
  test_linux:
    name: Tests (Linux + Burn NdArray)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - name: cargo test --features training
        # Pin rayon to a single worker for the test run only. The #232 PSRO
        # best-response loop (and other `par_iter` paths) dispatch heavy work
        # to the global rayon pool; on the 2-core CI runners, multiple rayon
        # workers spin-contend with cargo's concurrent test threads on the
        # saturated cores, which ~4x'd the Tests-job wall-clock (11min ->
        # 40min+). One rayon worker => the par_iter paths run serially in CI
        # (no spin-contention) while cargo keeps its normal test concurrency.
        # Real runs (cluster, all cores) are unaffected — they don't set this.
        env:
          RAYON_NUM_THREADS: "1"
        run: cargo test --features training

  # Same on macOS, to catch any platform-specific Burn issues early.
  test_macos:
    name: Tests (macOS + Burn NdArray)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - name: cargo check --features training
        run: cargo check --features training
      # Run tests as a separate step so a hang doesn't mask the check result.
      - name: cargo test --features training
        # Pin rayon to a single worker for the test run only. The #232 PSRO
        # best-response loop (and other `par_iter` paths) dispatch heavy work
        # to the global rayon pool; on the 2-core CI runners, multiple rayon
        # workers spin-contend with cargo's concurrent test threads on the
        # saturated cores, which ~4x'd the Tests-job wall-clock (11min ->
        # 40min+). One rayon worker => the par_iter paths run serially in CI
        # (no spin-contention) while cargo keeps its normal test concurrency.
        # Real runs (cluster, all cores) are unaffected — they don't set this.
        env:
          RAYON_NUM_THREADS: "1"
        run: cargo test --features training

  # Documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - name: cargo doc --no-deps --all-features
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  # Publish dry-run gate. Validates that the crate actually packages and
  # that no non-library assets (model checkpoints, the web app, the
  # bucket-brigade submodule, tooling) leak into the tarball. This catches
  # `exclude = [...]` regressions and path-dependency slips at PR time
  # instead of at hand-publish time. CI-safe: `--dry-run` never uploads and
  # needs no crates.io token.
  #
  # `bucket-brigade-core` is a path-only dependency behind the optional
  # `env-bucket-brigade` feature. `cargo publish` rejects *any* path
  # dependency (even an optional, unselected one), so this job applies the
  # same Cargo.toml edits that docs/RELEASING.md Step 2.5 prescribes for a
  # real publish: comment out the path dep + its feature and re-add the
  # `unexpected_cfgs` lint shim. The runner is ephemeral, so these edits
  # are throwaway (no revert needed). `--no-default-features` keeps the
  # verification rebuild fast by skipping the Burn training stack.
  publish_dry_run:
    name: Publish dry-run + tarball audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - name: Disable env-bucket-brigade for publish (RELEASING.md Step 2.5)
        run: |
          set -euo pipefail
          sed -i \
            's|^bucket-brigade-core = { path = "envs/bucket-brigade/bucket-brigade-core", default-features = false, optional = true }|# &|' \
            Cargo.toml
          sed -i \
            's|^env-bucket-brigade = \["bucket-brigade-core"\]|# &|' \
            Cargo.toml
          # Re-add the unexpected_cfgs shim so the now-disabled feature's
          # #[cfg(feature = "env-bucket-brigade")] gates don't warn. printf
          # (not a YAML-indented heredoc) keeps the appended TOML flush-left.
          printf '\n[lints.rust]\nunexpected_cfgs = { level = "warn", check-cfg = ['"'"'cfg(feature, values("env-bucket-brigade"))'"'"'] }\n' >> Cargo.toml
          # Fail loudly if the expected lines were not found (manifest drift).
          grep -q '^# bucket-brigade-core = { path' Cargo.toml
          grep -q '^# env-bucket-brigade = ' Cargo.toml
      - name: Assert tarball excludes non-library assets
        run: |
          set -euo pipefail
          # --allow-dirty: we just edited Cargo.toml above (a real publish
          # commits these edits first; here the runner is throwaway).
          cargo package --list --no-default-features --allow-dirty > /tmp/pkg-files.txt
          echo "Tarball contains $(wc -l < /tmp/pkg-files.txt) files:"
          cat /tmp/pkg-files.txt
          # ROM binaries (.bin/.rom/.a26) must never enter the tarball either
          # (env-atari, Option D). ROMs are copyrighted and are resolved at
          # runtime from the user's ale-py environment — see
          # docs/ALE_BINDING_STRATEGY.md.
          if grep -E '(^|/)models/|\.safetensors$|\.pt$|\.onnx$|\.bin$|\.rom$|\.a26$|(^|/)web/|(^|/)envs/|(^|/)scripts/|(^|/)\.loom/|(^|/)\.claude/|(^|/)\.github/' /tmp/pkg-files.txt; then
            echo "::error::Publish tarball includes excluded non-library assets (see matches above). Fix the exclude = [...] list in Cargo.toml."
            exit 1
          fi
          echo "Tarball content audit passed: no excluded assets present."
      - name: cargo publish --dry-run (no-default-features)
        run: cargo publish --dry-run --no-default-features --allow-dirty

  # Security audit
  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
