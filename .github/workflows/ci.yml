name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Check formatting
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        # NB: do not use --all -- that descends into path-dep submodules
        # (envs/bucket-brigade/) which have their own upstream rustfmt config
        # and cannot be reformatted from this repo.
        run: cargo fmt -- --check

  # Cheap "does it parse" check without the training stack.
  # `--no-default-features` drops the `training` feature (and thus `burn`).
  check_no_training:
    name: Check (no training)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - name: cargo check --no-default-features
        run: cargo check --no-default-features

  # Real test job with the default Burn `NdArray` backend on Linux. Pure
  # Rust — no external system libraries required.
  test_linux:
    name: Tests (Linux + Burn NdArray)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - name: cargo test --features training
        run: cargo test --features training

  # Same on macOS, to catch any platform-specific Burn issues early.
  test_macos:
    name: Tests (macOS + Burn NdArray)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - name: cargo check --features training
        run: cargo check --features training
      # Run tests as a separate step so a hang doesn't mask the check result.
      - name: cargo test --features training
        run: cargo test --features training

  # Documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - name: cargo doc --no-deps --all-features
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  # Security audit
  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
